# Argo CD deploys this folder. The portal pipeline only ever changes newTag below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: launchpad
images:
  - name: portal-image
    newName: ghcr.io/notdom1n1c/launchpad-portal
    newTag: sha-b2aa9b9
