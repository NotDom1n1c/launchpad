apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: portal-image
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GITHUB_OWNER
              value: NotDom1n1c
            - name: GITOPS_REPO
              value: launchpad
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 160Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # GitHub token from the launchpad-github secret (made by scripts/up.sh, never in Git)
            - name: github
              mountPath: /var/run/secrets/launchpad
              readOnly: true
      volumes:
        - name: github
          secret:
            secretName: launchpad-github
            optional: true
