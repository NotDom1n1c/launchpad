apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: __APP__
spec:
  ingressClassName: traefik
  rules:
    - host: __APP__.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: __APP__
                port:
                  name: http
