apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tenants-project.yaml
  - traefik.yaml
  - argocd-metrics.yaml
  - alerts.yaml

# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1
configMapGenerator:
  - name: launchpad-dashboards
    namespace: monitoring
    files:
      - dashboards/launchpad-apps.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
